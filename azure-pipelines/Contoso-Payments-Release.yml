---
trigger: none
resources:
  pipelines:
  - pipeline: ci
    source: Contoso-Payments-CI
pool:
  vmImage: ubuntu-latest
stages:
- stage: DeployProd
  jobs:
  - deployment: deploy
    environment: contoso-payments-prod
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureCLI@2
            inputs:
              azureSubscription: contoso-azure-prod
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: az webapp deploy --name payments-api
          - task: acme-corp.vault-tools.FetchSecret@2
            inputs:
              vault: contoso-kv
              secret: PAYMENTS_DB_PASSWORD
