name: Contoso-Payments/Contoso-Payments-CI
on:
  push:
    branches:
    - main
    - releases/*
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dotnetVersion:
        - 8.0.x
        - 6.0.x
    steps:
    - name: checkout
      uses: actions/checkout@v4.1.0
    - uses: actions/setup-dotnet@v4.0.0
      with:
        dotnet-version: "${{ matrix.dotnetVersion }}"
#     # This item has no matching transformer
#     - task: DownloadSecureFile@1
#       name: signingCert
#       inputs:
#         secureFile: contoso-code-signing.pfx
    - name: Build
      run: dotnet restore && dotnet build -c Release
#     # This item has no matching transformer
#     - task: SonarQubePrepare@5
#       inputs:
#         SonarQube: sonarqube-prod
#         scannerMode: MSBuild
#         projectKey: contoso-payments
    - name: Test
      run: dotnet test --collect:"XPlat Code Coverage"
    - uses: actions/upload-artifact@v4.1.0
      with:
        name: drop
        path: "${{ runner.temp }}"

# ──────────────────────────────────────────────────────────────────────
# bifrost: gap-fills below — REVIEW BEFORE USE
# Everything above this banner is GitHub Actions Importer output.
# Everything below is LLM-proposed YAML for constructs the Importer could
# not convert. Each block is tagged with its source construct + prompt id.
# ──────────────────────────────────────────────────────────────────────

# bifrost-gap-fill: DownloadSecureFile@1 (prompt: gap-fill.v1)
    - name: Download signing certificate (signingCert)
      id: signingCert
      shell: bash
      env:
        SECURE_FILE_CONTENTS_B64: ${{ secrets.CONTOSO_CODE_SIGNING_PFX }}
      run: |
        if [ -z "$SECURE_FILE_CONTENTS_B64" ]; then
          echo "::error::Secret CONTOSO_CODE_SIGNING_PFX is empty or not set"
          exit 1
        fi
        dest="$RUNNER_TEMP/contoso-code-signing.pfx"
        echo "$SECURE_FILE_CONTENTS_B64" | base64 --decode > "$dest"
        chmod 600 "$dest"
        # Mirror Azure DevOps DownloadSecureFile output variable signingCert.secureFilePath
        echo "secureFilePath=$dest" >> "$GITHUB_OUTPUT"

# bifrost-gap-fill: SonarQubePrepare@5 (prompt: gap-fill.v1)
    - name: SonarQube Prepare
      run: |
        dotnet tool install --global dotnet-sonarscanner
        dotnet sonarscanner begin \
          /k:"contoso-payments" \
          /d:sonar.host.url="${{ secrets.SONAR_HOST_URL }}" \
          /d:sonar.login="${{ secrets.SONAR_TOKEN }}"
